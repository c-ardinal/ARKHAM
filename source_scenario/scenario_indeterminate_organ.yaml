  - ID: node_1_1_airlock_entry
    グループ: ［ヘリポート・エアロック］探索フェーズ
    場面: 密閉用エアロック進入と高周波パルス照射
    章: 1
    場所: ヘリポート / エアロック
    描写: |-
      あなたたちは凍りついた耐寒耐圧扉を押し開け、密閉用エアロックへ身を滑り込ませる。
      背後で扉が噛み合い、暴風雪の轟音が遠ざかる。
      わずかな静寂が落ちた、その刹那だった。

      ――ツィィィィン……。

      耳の奥ではなく、頭蓋の骨そのものを細い針で引っ掻くような、酷い耳鳴りが突き抜けた。
      視界の隅が青白く明滅し、胃の腑が強くせり上がる。
      携行していたスマートフォン、計測器、あらゆる民生用電子機器の画面が一斉に走光性の虫のように明滅し、かすかな焦げ臭さとともに沈黙した。

      激しい眩暈に耐えかね、誰からともなく膝を折る。
      荒い息を吐きながら床を見つめたその時――。
      視界の右下に、青い光の残像のような「3つの数字」が浮かび上がっていた。
    行き先: 床のレポートとシステムの覚知
    タブ: 第1章：導入
  - ID: node_1_2
    グループ: ［ヘリポート・エアロック］探索フェーズ
    場面: 床のレポートとシステムの覚知
    章: 1
    場所: エアロック内側通路
    目的: 視界の青い数字（因果固定メカニクス）の仕組み理解と、最初のダイス・ストック（3枠）の決定
    所要時間: 15
    描写: |-
      荒い息を整えようと床へ手をついたとき、指先が乾いた紙片に触れる。
      非常灯の赤い光の下、それは黒ずんだ血痕で固められたレポートの切れ端だった。
      走り書きの文字が、震える筆跡で刻まれている。

      『……視界に浮かぶ数字は、これから私たちが迎える「確定した未来」の出目だ。
      　この光脈に晒された脳は、すでに因果の檻に繋がれている。
