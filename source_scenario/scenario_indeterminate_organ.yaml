    章: 1
    場所: ヘリポート / エアロック
    目的: 施設内への進入および未知の脳神経異変（因果固定システム）の初知覚
    所要時間: 10
    描写: |-
      北極海沖の母船『ボレアリス号』を発って、四十分。
      輸送ヘリのキャビンを揺らし続けていた風の唸りが、いっそう鋭く高まる。
      灰色の空と白い氷床の境界は地吹雪に消え、眼下にはただ、吹き荒れる雪煙ばかりが広がっていた。

      やがて、白い帳の切れ間に、巨大な黒い影が浮かび上がる。
      氷床へ突き刺さるように穿たれた巨大な縦穴。その開口部を覆う、六角形の装甲ドーム――極秘研究施設「アトランティス・アンカー」だ。
      誘導灯は消え、着陸標識も新雪に半ば埋もれている。風向計はちぎれんばかりに激しく煽られていた。

      ここから先、退路はない。
      猛烈な横風の中、操縦桿を握る手が、凍てつく機体を標的へと押し当てていく。
    KP情報:
