  - ID: node_4_1
    場面: True End / Normal End「確率波の収束停止」
    章: 4
    場所: 極地脱出ヘリ
    目的: アンカー完全停止による生還と事件の結末描写
    所要時間: 20
    描写: |-
      最後の停止コードが受理された瞬間、制御室を満たしていた脈動が途絶える。
      あまりにも唐突な静寂だった。
      因果律アンカーの青い光が内側から萎む。空間の歪みはほどけ、Dr.ヘイズであった巨躯も支えを失った殻のように崩れていく。
      視界へ焼き付いていた数字が、古い映像の砂嵐のように乱れた。輪郭を失い、薄れ、やがて一つ残らず消えていく。
      次に起こることを知らない――その当たり前の暗闇を、あなたたちは初めて安堵とともに迎える。
      地上へ戻るころ、長く島を閉ざしていた低気圧は、ようやく動き始めていた。吹雪の彼方に淡い空が覗き、途絶していた通信機から母船の呼びかけが届く。
      エアロックの向こうでは、白い雪原に残された調査ヘリが、帰還する者を待っている。

      【クリア報酬】
      - 生還およびスクラム停止成功: 1D6 SAN回復
      - 【機密暗号USB】持ち帰り（True End）: 真相究明功労として 1D6 SAN回復

      📖 〔後日談：事件の処理と真相の開示〕
