      - コンプライアンス宣言: 本シナリオはフィクションであり、実在の人物、団体、地域、宗教、人種、性的指向（LGBTQ+）、特定の思想・信条等を攻撃・差別する意図は一切ありません。

      【シナリオ概要】
      - 想定時間: 3.5〜4.0時間（ボイスセッション想定 / 約220分）
      - 推奨人数: 3〜4名
      - 対応ルール: クラシック版（第6版）を基礎とする。クリティカル／ファンブルの数値範囲は使用する卓の裁定に従う
      - 全PC共通推奨技能: 〈目星〉 〈聞き耳〉 〈図書館〉
      - 全PC共通準推奨技能: 〈回避〉
      - 舞台: 現代・北極海の孤島にある永久凍土・氷床下研究施設「アトランティス・アンカー」
    行き先: 【探索者作成＆公開ハンドアウト一覧】
    タブ: 事前情報
  - ID: node_0_2
    グループ: ［シナリオ導入・KP事前準備］
    場面: 【探索者作成＆公開ハンドアウト一覧】
    種別: メモ
    章: 0
    描写: |-
      【探索者作成ルール：ハンドアウト (HO)】
      探索者はPOGIC直属の「極地緊急事態即応・事故調査チーム」として招集されます。洋上の調査母船『ボレアリス号』からヘリで連絡途絶施設「アトランティス・アンカー」へ急行します。

      👥 人数に応じたHO割り振りの規定
      - 4名プレイ時: HO1〜HO4 を各1名ずつ担当。
      - 3名プレイ時: 1名のPLが 〔HO1 / HO4 兼任 (警護兼極地操縦士)〕 を担当し、HO2、HO3を加えた3名構成でプレイします。
        ※HO1とHO4の兼任者には、操縦と警護の両方を担える経歴を設定してください。3名用の戦闘・コンソール緩和規定を適用します。

      📋 公開ハンドアウト一覧
      - HO1〔極地操縦士〕: POGIC航空輸送班操縦士。極地用ヘリの操縦を担当。現地への往復と脱出の生命線を担う。
        推奨技能: 〈操縦（ヘリ）〉 または 〈ナビゲート〉 / 専門技能: 〈機械修理〉 または 〈物理学〉
      - HO2〔医療・生化学専門家〕: POGIC医療主任・生化学者。極限環境医学の専門家。職員の安否確認、負傷者治療、病理・異変の解析を担当。
        推奨技能: 〈医学〉 〈化学〉 〈精神分析〉 / 専門技能: 〈生物学〉 または 〈薬学〉
      - HO3〔システム・電気技術者〕: POGICインフラ主任技官。通信・電力網・端末セキュリティのエキスパート。途絶原因の究明と設備復旧を担当。
        推奨技能: 〈電気修理〉 〈コンピューター〉 / 専門技能: 〈電子工学〉 または 〈物理学〉
      - HO4〔警護・フィールド探査員〕: POGIC保安・危機管理員。極地でのサバイバル、防犯、危険排除を担当。前線の安全確保と障害突破を担う。
        推奨技能: 〈戦闘技能〉 〈鍵開け〉 または 〈応急手当〉 / 専門技能: 〈追跡〉 または 〈目星〉
