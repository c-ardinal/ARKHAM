  レギュレーション: |-
    新クトゥルフ神話TRPGルールブック（第7版）またはクラシック版（第6版）準拠。
    【コンテンツ・ワーニング (CW)】: 肉体変異、自傷痕の発見、SF的・生体工学的な脳神経被害の表現が含まれます。
    【コンプライアンス宣言】: 本シナリオはフィクションであり、実在の人物、団体、地域、宗教、人種、性的指向（LGBTQ+）、特定の思想・信条等を攻撃・差別する意図は一切ありません。
    【因果固定メカニクス全規定】
    1. ダイス・ストック（3枠）: 1D100判定時、ダイスを振るのではなく手元のストックから1つ選んで消費・即座に1D100を1回振り補充する。適用対象は1D100判定のみ（技能・SAN・回避）。ダメージダイス（1D6等）は通常通り振る。
    2. 生体過負荷（96〜100）: 手番末にストック内に96〜100を残すと 1D3 MP喪失。
    3. 簡易放電行動と神経ノイズ: 1ラウンド/1分を費やして簡易放電行動（100%成功）を行うことで、確定失敗を安全に消費できる。累積放電回数に応じてペナルティ（1〜2回=無償 / 3〜4回=1 MP喪失 / 5回目以降=1D3 MP喪失＋全技能-5%ペナルティ累積）。
    4. シナプス過燃焼（出目調整）: 判定直前、PLの任意で出目を1点減少（代償: 1D3 MPまたは1 HP）。
    5. 不意のSANチェック: 直ちに行う。ストックの最悪値（最大値）の出目を強制適用する。
    6. 敵の行動: PCのみストック適用。敵は通常通りKPがダイスを振る。
    7. 描写と卓のリアリティ管理: 探索者の目視・情報フィードバックは物理的・光学的な現象として描写する。
  あらすじ: |-
    「極寒の白銀に閉ざされた極秘施設。72時間の沈黙を破り、同僚たちを救出せよ」

    北極海に浮かぶ孤島の永久凍土・氷床下に建設された極秘研究施設「アトランティス・アンカー」。  
    素粒子物理と極地地質資源を観測していたはずのその重要拠点から、突如として全通信および生体テレメトリが途絶した。
    経過時間は、すでに72時間。

    島を取り巻く猛吹雪の中、観測母船『ボレアリス号』から発進した極地緊急事態即応・事故調査班のヘリコプターは、白い雪煙を巻き上げながら施設屋上ヘリポートへと着陸する。
    生存者の救助と事態の収拾――それがあなたたちに託された任務である。
シナリオの真相: |-
  【シナリオの背景 / 事件の真相（KP専用情報）】

  🌌 1. 太古の遺物「因果律アンカー」と時空結晶
  北極海に浮かぶ孤島の永久凍土・氷床の最深部には、未知の幾何学的結晶構造体「因果律アンカー」が眠っていました。
  それは太古の地球を訪れた地球外知性体（ユゴスよりのもの／ミ＝ゴ）が、時空の確率の揺らぎを強制収束・固定し、自らの望む物理事象を確定させるために設置した超時空アンカー装置です。
  この結晶鉱脈は人類の既存科学では不可知の特殊波動を放っており、高圧電撃で励起されると、周囲数キロメートルに存在する知的生命体の脳神経・シナプスに直接干渉し、「確定された未来の出目（01〜100）」を視覚野へ焼き付ける性質を持っています。

  🏢 2. 極秘研究施設「アトランティス・アンカー」の設立とヘイズの暴走
  国際極地海洋・地質調査コンソーシアム（通称POGIC）は数年前、北極圏深層で未知の超高密度量子共鳴鉱脈を発見。「素粒子物理および極地資源観測所」として巨額の正規研究予算を投じ、氷層研究施設「アトランティス・アンカー」を建設しました。
  しかし、現地責任者に任命された施設長Dr.マーカス・ヘイズ（理論物理学者）は、発掘された結晶が太古の地球外知性体（ミ＝ゴ）の遺物「因果律アンカー」であることを突き止め、その神話的性質に魅了されます。
  ヘイズは「未来の確率を完全に支配・決定する神の力」を得るという誇大妄想に取り憑かれ、POGIC本部へは「順調な冷却物理実験が継続中」と虚偽の定期報告ログを送り続けて欺きながら、施設の目的を独断で生体時空兵器の開発へと変貌させていきました。

  ⏳ 3. 破滅のタイムライン（事故発生から探索者到着まで）
  - 3日前（共鳴炉暴走の瞬間）: 最深部の共鳴炉において、ヘイズはアンカーへの強制電位パルス励起実験を強行。結晶は制御限界を超えて臨界共鳴を起こし、施設全域に高周波パルスが充満。全職員の脳神経に「決定された未来の出目」が固着する。
  - 2日前（生体過負荷と狂気の連鎖）: 高周波パルスによる神経ノイズは職員たちの脳を焼き始めます。手番内に出目を消費しきれず視覚野に高数値（96〜100）を残した研究員たちが次々に「生体過負荷」を発症し、脳組織が超高温で焦灼。その激痛と狂乱に耐えかね、頭を壁や机の鉄角に自ら叩きつけて頭蓋を破壊する凄惨な自傷死が多発しました。
  - 1日前（生体脳摘出と壊滅）: 暴走を制御するため、ヘイズは生き残っていた主任研究員たち（Dr.ヴァンス、Dr.サトウら）を監禁。アンカーの膨大な確率演算を肩代わりさせる並列バイオ演算ユニットとして、Dr.ヴァンスらの生体脳を強制摘出して共鳴炉システムに直結。施設は完全に機能を喪失し、地下試掘坑の作業員たちは結晶変異体に成り果てました。
  - 現在（探索者の到着）: 外部との通信が途絶して72時間後。POGIC本部から派遣された探索者チームが、猛吹雪のなかヘリポートへと降り立ちます。

  📋 4. 施設滞在職員（全12名）の完全点呼記録（KP把握用）
  1. Dr.マーカス・ヘイズ（施設長）: ［共鳴炉制御室］。大型結晶変異体の中枢核と同化。
  2. Dr.サトウ（主任研究員）: ［受入検疫室］。瀕死。探索者にカードキーを託して絶命。
  3. Dr.ダニエル・ヴァンス（神経工学技官）: ［第2実験棟］。生体脳を摘出され脳缶として稼働。
  4. 警備主任（元軍人）: ［警備室］。自傷死。
  5. 案内デスク当直研究員（1名）: ［エントランスロビー］。自傷死。
  6. 結晶変異作業員A（1名）: ［地下試掘坑・鉱石保管庫］。結晶変異体と化している。
  7. 結晶変異作業員B（1名）: ［地下試掘坑・鉱石保管庫］。結晶変異体と化している。
  8. 研究員遺体A（1名）: ［居住・医務・食堂区画］。冷凍保管ロッカーに安置。
  9. 研究員遺体B（1名）: ［居住・医務・食堂区画］。冷凍保管ロッカーに安置。
  10. 作業員遺体C（1名）: ［居住・医務・食堂区画］。冷凍保管ロッカーに安置。
  11. 共鳴炉焼損脳A（1名）: ［共鳴炉制御室］。バイオ演算ユニットとして焼損。
  12. 共鳴炉焼損脳B（1名）: ［共鳴炉制御室］。バイオ演算ユニットとして焼損。
  ※施設職員12名の所在は上記のとおり。ゲーム中は警備室の遺体、冷凍保管ロッカー、脳缶、共鳴炉の焼損脳を確認することで全員の安否を照合できます。

  🧠 5. シナリオタイトル『凍てざる因果律の彼方に』の真意（探索者が適応できる理由）
  因果律アンカーが放つ高周波パルスは、確定した未来の数値を脳神経へ強制します。事故直後の職員たちは仕組みを知らないまま高出力パルスへ曝露され、対処法を確立する前に生体過負荷や結晶侵蝕を受けました。
  探索者は事故後に出力が低下した外縁部から進入し、床に残された【血塗られた観察メモ】によって数値を安全な行動へ逃がす方法を早期に知ります。脳が一つの確定結果に従うだけでなく、複数の行動候補から結果の受け皿を選び直す適応性を意識的に利用できるため、短時間なら正気と身体機能を維持できます。ただし完全な耐性ではなく、長時間の曝露や生体過負荷は探索者にも同じ破滅をもたらします。

  すべてが凍りつく極北にあっても、因果律アンカーが固定した未来だけは停止せず、人間の認識と肉体を侵し続けます。「凍てざる因果律」とはその異常な因果の流れを、「彼方に」とは、定められた結果の向こう側へ生還の可能性を求めて進む探索者たちを暗示しています。
