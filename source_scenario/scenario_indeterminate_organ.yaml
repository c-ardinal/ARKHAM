    描写: |-
      クトゥルフ神話TRPGシナリオ『凍てざる因果律の彼方に』 (Beyond the Unfrozen Law of Causality)

      【権利表記＆注意事項】
      本書は、「株式会社KADOKAWA」および「Chaosium Inc.」が権利を有する『クトゥルフ神話TRPG』の二次創作物です。
