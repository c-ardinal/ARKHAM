  全体共有: |-
    【探索者たちの招集背景・POGIC組織概要と公式ミッション】

    🌐 国際極地海洋・地質調査コンソーシアム（POGIC）の概要
    国際極地海洋・地質調査コンソーシアム（Polar Ocean & Geological Investigation Consortium、通称「POGIC」）は、北極海および周辺極域における海洋物理・深海地質・極限環境生命の研究を目的として設立された多国籍調査組織です。
    主要国の研究機関や民間資源開発企業が出資しており、複数の極地観測船や研究施設を運用しています。

    探索者たちはPOGIC直属のメンバーで構成された「極地緊急事態即応・事故調査チーム」です。
    - 任務:
      1. 北極海孤島の永久凍土・氷床下研究施設［アトランティス・アンカー］との定期通信途絶（72時間経過）の原因調査（※POGIC本部は猛吹雪によるアンテナ倒壊や地下メタンガス噴出事故と推測）。
      2. 施設滞在職員（全12名）の安否確認。必要に応じて生存者の救助・搬送。
      3. 施設内の主要設備・基幹データの保全と現状の把握。

