    タブ: 事前情報
  - ID: node_0_3
    グループ: ［シナリオ導入・KP事前準備］
    場面: 【因果固定メカニクス全規定＆ハック対策集】
    種別: メモ
    章: 0
    描写: |-
      【共通ルール：因果固定メカニクス】
      1. ダイス・ストック（3枠）: 1D100判定時、ダイスを振るのではなくストックの出目を選択して消費する。消費直後に1D100を1回振り補充する。適用対象: 1D100を使用する全判定（技能・SAN・回避）。※ダメージダイス（1D6等）は通常通り振る。
      2. 生体過負荷（96〜100）: 手番末にストック内に96〜100を残すと 1D3 MP喪失。
      3. 簡易放電行動と神経ノイズ: 1分/1手番を費やし〈簡易動作判定（100%成功）〉で確定失敗し放電できる。
         - 放電カウント: 1〜2回目=無傷 / 3〜4回目= 1 MP 喪失 / 5回目以降= 1D3 MP 喪失 ＋ 全判定に +5%（難化）補正が累積。
      4. シナプス同期（出目交換）: 両PLの合意で出目を1つ交換（両者 1D3 MP または 1 HP 減少）。
      5. 不意のSANチェック: 選択不可。ストックの最古（一番左）の出目を強制消費。
      6. 敵の判定: PCのみストック適用。敵は通常通りKPがダイスを振る。
      7. 説得力と解釈のリアリティ規定: 救済措置やフォールバック導線は物理構造・合理的手順の代償として描写される。
