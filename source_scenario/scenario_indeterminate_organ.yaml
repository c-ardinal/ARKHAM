    場面: 最深部：共鳴炉制御室（スクラムミッション）
    章: 3
    場所: 最深部：共鳴炉制御室
    目的: Dr.ヘイズ融合体との決戦、および3基のコンソール操作による共鳴炉スクラム緊急停止
    所要時間: 45
    登場人物: 大型ミ＝ゴ生体防衛端末（最深部の怪異）
    描写: |-
      三つ目の認証灯が変わる。直後、隔壁が左右へ退き、その向こうから青い光と、地の底で鳴るような低周波が溢れ出した。
      最深部、共鳴炉制御室。
      巨大なドーム状の空間の中央で、数十メートルに及ぶ「因果律アンカー」が、心臓のように収縮と膨張を繰り返している。
      その青い光のただ中から、巨躯が身を起こした。

      全身を結晶の甲殻で覆い、背からは巨大な神経束を伸ばした異形の怪物。
      その胸部の中央に、苦悶の表情を浮かべたDr.ヘイズの顔が、結晶に半ば呑み込まれながら埋め込まれていた。

