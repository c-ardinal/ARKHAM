<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="100%" height="100%">
  <defs>
    <!-- Background & Cosmic Gradients -->
    <radialGradient id="bg-glow" cx="50%" cy="46%" r="65%">
      <stop offset="0%" stop-color="#0c2540" stop-opacity="0.9"/>
      <stop offset="35%" stop-color="#07172b" stop-opacity="0.95"/>
      <stop offset="70%" stop-color="#030813" stop-opacity="1"/>
      <stop offset="100%" stop-color="#010307" stop-opacity="1"/>
    </radialGradient>

    <radialGradient id="anchor-core-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#7df9ff" stop-opacity="1"/>
      <stop offset="25%" stop-color="#00d2ff" stop-opacity="0.8"/>
      <stop offset="55%" stop-color="#7000ff" stop-opacity="0.4"/>
      <stop offset="85%" stop-color="#0051ff" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>

    <!-- Metallic & Crystal Linear Gradients -->
    <linearGradient id="text-ice-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="30%" stop-color="#d9f7ff"/>
      <stop offset="65%" stop-color="#7de2fc"/>
      <stop offset="85%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#1e40af"/>
    </linearGradient>

    <linearGradient id="text-accent-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#c084fc"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>

    <linearGradient id="crystal-facet-1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e0f2fe" stop-opacity="0.95"/>
      <stop offset="50%" stop-color="#38bdf8" stop-opacity="0.75"/>
      <stop offset="100%" stop-color="#0369a1" stop-opacity="0.6"/>
    </linearGradient>

    <linearGradient id="crystal-facet-2" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc" stop-opacity="0.9"/>
      <stop offset="50%" stop-color="#818cf8" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#312e81" stop-opacity="0.5"/>
    </linearGradient>

    <linearGradient id="crystal-facet-3" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.9"/>
      <stop offset="40%" stop-color="#a5f3fc" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0.4"/>
    </linearGradient>

    <linearGradient id="line-glow-cyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0"/>
      <stop offset="30%" stop-color="#38bdf8" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#ffffff" stop-opacity="1"/>
      <stop offset="70%" stop-color="#c084fc" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#c084fc" stop-opacity="0"/>
    </linearGradient>

    <!-- Filters for Bloom and Neon Glow -->
    <filter id="neon-glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="blur1"/>
      <feGaussianBlur stdDeviation="18" result="blur2"/>
      <feMerge>
        <feMergeNode in="blur2"/>
        <feMergeNode in="blur1"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="deep-glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="25" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="subtle-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="12" flood-color="#00f2fe" flood-opacity="0.35"/>
      <feDropShadow dx="0" dy="12" stdDeviation="24" flood-color="#000000" flood-opacity="0.95"/>
    </filter>

    <!-- Pattern for Quantum Permafrost Grid -->
    <pattern id="polar-grid" width="80" height="80" patternUnits="userSpaceOnUse">
      <circle cx="40" cy="40" r="0.75" fill="#38bdf8" opacity="0.3"/>
      <line x1="0" y1="40" x2="80" y2="40" stroke="#0ea5e9" stroke-width="0.5" stroke-dasharray="1 7" opacity="0.15"/>
      <line x1="40" y1="0" x2="40" y2="80" stroke="#0ea5e9" stroke-width="0.5" stroke-dasharray="1 7" opacity="0.15"/>
    </pattern>
  </defs>

  <!-- Background Base -->
  <rect width="1280" height="720" fill="url(#bg-glow)"/>
  <rect width="1280" height="720" fill="url(#polar-grid)"/>

  <!-- Atmospheric Background Ambient Lights -->
  <circle cx="640" cy="300" r="320" fill="url(#anchor-core-glow)"/>
  <ellipse cx="640" cy="310" rx="550" ry="140" fill="#00d2ff" opacity="0.08" filter="url(#deep-glow)"/>
  <ellipse cx="640" cy="270" rx="380" ry="90" fill="#a855f7" opacity="0.12" filter="url(#deep-glow)"/>

  <!-- Technical Framing & Coordinate Marks -->
  <g opacity="0.55" stroke="#38bdf8" stroke-width="1">
    <!-- Top-left tech bracket -->
    <path d="M 40 80 L 40 40 L 80 40" fill="none"/>
    <line x1="40" y1="40" x2="52" y2="52"/>
    <!-- Top-right tech bracket -->
    <path d="M 1240 80 L 1240 40 L 1200 40" fill="none"/>
    <line x1="1240" y1="40" x2="1228" y2="52"/>
    <!-- Bottom-left tech bracket -->
    <path d="M 40 640 L 40 680 L 80 680" fill="none"/>
    <line x1="40" y1="680" x2="52" y2="668"/>
    <!-- Bottom-right tech bracket -->
    <path d="M 1240 640 L 1240 680 L 1200 680" fill="none"/>
    <line x1="1240" y1="680" x2="1228" y2="668"/>
  </g>

  <!-- Technical Headings & Coordinates -->
  <g font-family="'Inter', 'Courier New', monospace" font-size="10" fill="#38bdf8" letter-spacing="3" opacity="0.75">
    <text x="60" y="55">ATLANTIS ANCHOR LABS // SECTOR: PERMAFROST-04</text>
    <text x="60" y="70">SYS.VER: 22.0 // DETERMINISTIC QUANTUM MATRIX</text>
    <text x="1220" y="55" text-anchor="end">LOC: 79°24'N, 014°18'E</text>
    <text x="1220" y="70" text-anchor="end">FREQ: 1420.405 MHz [RESONANT]</text>
  </g>

  <!-- ===================================================================== -->
  <!-- CAUSALITY ANCHOR MOTIF (因果律アンカー・幾何学時空結晶)                 -->
  <!-- ===================================================================== -->
  <g transform="translate(640, 275)">
    <!-- Outer Concentric Calibration Rings -->
    <g opacity="0.35">
      <circle cx="0" cy="0" r="230" fill="none" stroke="#38bdf8" stroke-width="1" stroke-dasharray="3 6"/>
      <circle cx="0" cy="0" r="215" fill="none" stroke="#818cf8" stroke-width="0.75"/>
      <circle cx="0" cy="0" r="195" fill="none" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="12 24 2 24"/>
      <circle cx="0" cy="0" r="145" fill="none" stroke="#a5f3fc" stroke-width="0.75" stroke-dasharray="4 8"/>
    </g>

    <!-- Compass / Axis Ticks & Quantum Dice Stock Nodes (01 ... 100) -->
    <g opacity="0.6">
      <line x1="-240" y1="0" x2="240" y2="0" stroke="url(#line-glow-cyan)" stroke-width="1.5"/>
      <line x1="0" y1="-220" x2="0" y2="190" stroke="url(#line-glow-cyan)" stroke-width="1.5"/>
      
      <!-- 45-degree causality axis -->
      <line x1="-160" y1="-160" x2="160" y2="160" stroke="#38bdf8" stroke-width="0.75" stroke-dasharray="2 6" opacity="0.4"/>
      <line x1="160" y1="-160" x2="-160" y2="160" stroke="#c084fc" stroke-width="0.75" stroke-dasharray="2 6" opacity="0.4"/>

      <!-- Quantum Probability Indicators (01, 50, 96, 100) -->
      <circle cx="-195" cy="0" r="3" fill="#38bdf8" filter="url(#neon-glow)"/>
      <text x="-195" y="-8" font-family="'Inter', sans-serif" font-size="9" fill="#7dd3fc" text-anchor="middle" letter-spacing="1">DICE:01</text>

      <circle cx="195" cy="0" r="3" fill="#c084fc" filter="url(#neon-glow)"/>
      <text x="195" y="-8" font-family="'Inter', sans-serif" font-size="9" fill="#e879f9" text-anchor="middle" letter-spacing="1">DICE:100</text>

      <circle cx="0" cy="-195" r="3" fill="#ffffff" filter="url(#neon-glow)"/>
      <text x="0" y="-202" font-family="'Inter', sans-serif" font-size="9" fill="#f8fafc" text-anchor="middle" letter-spacing="1">ΔΨ:MAX</text>
    </g>

    <!-- Quantum Waveform Pulse Ring -->
    <path d="M -180 0 Q -135 -40 -90 0 T 0 0 T 90 0 T 180 0" fill="none" stroke="#00f2fe" stroke-width="1.5" opacity="0.4" filter="url(#neon-glow)"/>
    <path d="M -180 0 Q -135 40 -90 0 T 0 0 T 90 0 T 180 0" fill="none" stroke="#a855f7" stroke-width="1.5" opacity="0.35"/>

    <!-- Geometric Hexagonal Resonator (ミ＝ゴ超科学骨格) -->
    <polygon points="0,-150 130,-75 130,75 0,150 -130,75 -130,-75" 
             fill="none" stroke="#38bdf8" stroke-width="1.5" opacity="0.6"/>
    <polygon points="0,-130 112,-65 112,65 0,130 -112,65 -112,-65" 
             fill="#0284c7" fill-opacity="0.04" stroke="#c084fc" stroke-width="1" stroke-dasharray="6 6" opacity="0.5"/>

    <!-- Central Time-Space Crystal (大時空結晶) -->
    <g filter="url(#subtle-shadow)">
      <!-- Top Diamond Spear -->
      <polygon points="0,-125 38,-35 0,-10" fill="url(#crystal-facet-1)"/>
      <polygon points="0,-125 -38,-35 0,-10" fill="url(#crystal-facet-2)"/>
      <!-- Lower Anchor Blade -->
      <polygon points="0,-10 38,-35 46,70 0,120" fill="url(#crystal-facet-2)"/>
      <polygon points="0,-10 -38,-35 -46,70 0,120" fill="url(#crystal-facet-1)"/>
      <!-- Center Facet Keystones -->
      <polygon points="0,-70 20,-30 0,10 -20,-30" fill="url(#crystal-facet-3)"/>
      <polygon points="0,10 24,55 0,95 -24,55" fill="url(#crystal-facet-3)"/>
      <!-- Core Brilliant Glint -->
      <circle cx="0" cy="-10" r="5" fill="#ffffff" filter="url(#neon-glow)"/>
      <polygon points="0,-35 4,-10 0,15 -4,-10" fill="#ffffff" opacity="0.9"/>
    </g>

    <!-- Radiating Crystalline Shards (散乱する時空結晶片) -->
    <g opacity="0.8">
      <polygon points="85,-110 95,-102 92,-92 82,-100" fill="#7dd3fc" opacity="0.7"/>
      <polygon points="-88,-115 -78,-107 -82,-96 -92,-104" fill="#c084fc" opacity="0.7"/>
      <polygon points="120,40 132,48 126,58 114,50" fill="#a5f3fc" opacity="0.8"/>
      <polygon points="-120,40 -110,48 -116,58 -126,50" fill="#93c5fd" opacity="0.8"/>
      <polygon points="45,130 52,136 48,144 41,138" fill="#38bdf8" opacity="0.6"/>
      <polygon points="-45,130 -38,136 -42,144 -49,138" fill="#c084fc" opacity="0.6"/>
    </g>
  </g>

  <!-- ===================================================================== -->
  <!-- MAIN TITLE TYPOGRAPHY (「凍てざる因果律の彼方に」)                     -->
  <!-- ===================================================================== -->
  <g transform="translate(640, 485)">
    <!-- Subtle Background Shadow Plate for Legibility -->
    <rect x="-560" y="-85" width="1120" height="180" rx="30" fill="#030712" fill-opacity="0.55" filter="url(#deep-glow)"/>

    <!-- Top Badge / World Definition -->
    <g transform="translate(0, -62)">
      <!-- Line decorators -->
      <line x1="-360" y1="0" x2="-140" y2="0" stroke="url(#line-glow-cyan)" stroke-width="1.5"/>
      <line x1="140" y1="0" x2="360" y2="0" stroke="url(#line-glow-cyan)" stroke-width="1.5"/>
      <rect x="-130" y="-12" width="260" height="24" rx="12" fill="#082f49" fill-opacity="0.8" stroke="#38bdf8" stroke-width="1"/>
      <text x="0" y="4" font-family="'Hiragino Kaku Gothic ProN', 'Yu Gothic', 'Noto Sans JP', sans-serif" font-size="11" font-weight="700" fill="#7dd3fc" text-anchor="middle" letter-spacing="4">
        CALL OF CTHULHU TRPG SCENARIO
      </text>
    </g>

    <!-- Main Title Kanji: 凍 て ざ る 因 果 律 の 彼 方 に -->
    <!-- Glow Underlay -->
    <text x="0" y="32" 
          font-family="'Hiragino Mincho ProN', 'Yu Mincho', 'Noto Serif JP', 'Cinzel', serif" 
          font-size="62" 
          font-weight="900" 
          letter-spacing="14" 
          text-anchor="middle" 
          fill="#00f2fe" 
          opacity="0.6" 
          filter="url(#neon-glow)">
      凍てざる因果律の彼方に
    </text>

    <!-- Fore Title with Gradient & Crisp Precision -->
    <text x="0" y="32" 
          font-family="'Hiragino Mincho ProN', 'Yu Mincho', 'Noto Serif JP', 'Cinzel', serif" 
          font-size="62" 
          font-weight="900" 
          letter-spacing="14" 
          text-anchor="middle" 
          fill="url(#text-ice-grad)" 
          stroke="#082f49" 
          stroke-width="1"
          filter="url(#subtle-shadow)">
      凍てざる因果律の彼方に
    </text>

    <!-- English Subtitle: BEYOND THE UNFROZEN LAW OF CAUSALITY -->
    <g transform="translate(0, 68)">
      <line x1="-420" y1="0" x2="420" y2="0" stroke="url(#line-glow-cyan)" stroke-width="1.2"/>
      <!-- Center diamond pip -->
      <polygon points="0,-4 4,0 0,4 -4,0" fill="#ffffff" filter="url(#neon-glow)"/>
      <text x="0" y="24" 
            font-family="'Cinzel', 'Times New Roman', 'Montserrat', serif" 
            font-size="15" 
            font-weight="700" 
            letter-spacing="11" 
            text-anchor="middle" 
            fill="url(#text-accent-grad)">
        BEYOND THE UNFROZEN LAW OF CAUSALITY
      </text>
    </g>

    <!-- Scenario Tagline / Story Prompt -->
    <g transform="translate(0, 116)" opacity="0.85">
      <text x="0" y="0" 
            font-family="'Hiragino Kaku Gothic ProN', 'Yu Gothic', 'Noto Sans JP', sans-serif" 
            font-size="12" 
            font-weight="500" 
            fill="#bae6fd" 
            text-anchor="middle" 
            letter-spacing="5">
        極寒の白銀に閉ざされた極秘施設。72時間の沈黙を破り、同僚たちを救出せよ。
      </text>
    </g>
  </g>

  <!-- Bottom Technical Status Bar -->
  <g transform="translate(0, 685)" opacity="0.6">
    <line x1="60" y1="0" x2="1220" y2="0" stroke="#0369a1" stroke-width="0.75"/>
    <g font-family="'Inter', 'Courier New', monospace" font-size="9" fill="#38bdf8" letter-spacing="2">
      <text x="60" y="16">SYSTEM: POGIC IMMEDIATE RESPONSE TEAM</text>
      <text x="640" y="16" text-anchor="middle">MODULE: TIME-SPACE COLLAPSE // DUAL PROBABILITY ENGINE</text>
      <text x="1220" y="16" text-anchor="end">STATUS: UNSTABLE DETERMINISTIC BURST</text>
    </g>
  </g>
</svg>